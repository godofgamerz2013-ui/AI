name: OmniRoute - mirror official container

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/omniroute.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: omniroute-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull official published OmniRoute image
        run: |
          docker pull diegosouzapw/omniroute:latest
          docker image inspect diegosouzapw/omniroute:latest --format '{{.Id}}'

      - name: Mirror image to this repository's GHCR
        run: |
          docker tag diegosouzapw/omniroute:latest ghcr.io/${{ github.repository_owner }}/omniroute:latest
          docker push ghcr.io/${{ github.repository_owner }}/omniroute:latest

      - name: Runtime instructions
        run: |
          echo "Official OmniRoute image mirrored to GHCR."
          echo "Run with persistent storage mounted at /app/data and publish port 20128."
          echo "GitHub Actions is a build/registry service, not a persistent runtime host."
