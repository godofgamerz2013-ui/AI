# Optional single-host stack: gateway + LocalAI.
# Copy .env.localai.example to .env.localai and fill in secrets/model IDs.
# Keep LocalAI bound to the private Docker network; do not publish port 8080.
services:
  localai:
    image: localai/localai:latest
    container_name: local-ai
    restart: unless-stopped
    environment:
      MODELS_PATH: /models
      THREADS: ${LOCALAI_THREADS:-4}
      CONTEXT_SIZE: ${LOCALAI_CONTEXT_SIZE:-4096}
    volumes:
      - localai-models:/models
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  gateway:
    build: .
    container_name: unified-ai-gateway
    restart: unless-stopped
    env_file:
      - .env.localai
    environment:
      LOCALAI_BASE_URL: http://localai:8080/v1
      PROVIDER_FALLBACK_ORDER: openai,google,deepseek,anthropic,openrouter,localai
      PORT: "8080"
    ports:
      # Gateway public API on host port 8081; put HTTPS/reverse proxy in front.
      - "127.0.0.1:8081:8080"
    depends_on:
      localai:
        condition: service_healthy

volumes:
  localai-models:
